<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每月電費分攤計算器</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0f1117;--card:#1a1d27;--card2:#222533;--border:#2e3148;
  --text:#e4e6f0;--text2:#9499b3;--text3:#5d6283;
  --accent:#6c5ce7;--accent2:#a29bfe;--accent-glow:rgba(108,92,231,.15);
  --red:#ff6b6b;--green:#51cf66;--amber:#fcc419;
  --meter-a:#ff6b6b;--meter-b:#ffa94d;--meter-c:#fcc419;--meter-d:#51cf66;--meter-e:#74c0fc;
}
body{font-family:'Noto Sans TC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px}
.app{max-width:680px;margin:0 auto}

.header{text-align:center;margin-bottom:32px}
.header h1{font-size:1.6rem;font-weight:900;letter-spacing:-.02em;
  background:linear-gradient(135deg,var(--accent2),var(--accent),#fd79a8);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header p{color:var(--text2);font-size:.85rem;margin-top:6px}

.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;margin-bottom:16px;transition:border-color .2s}
.card:hover{border-color:var(--accent)}
.card-title{font-size:.8rem;font-weight:500;color:var(--text2);text-transform:uppercase;letter-spacing:.08em;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.card-title span{font-size:1rem}

.bill-input-wrap{position:relative}
.bill-input{width:100%;background:var(--card2);border:2px solid var(--border);border-radius:12px;padding:16px 20px;
  font-size:2rem;font-family:'JetBrains Mono',monospace;font-weight:600;color:var(--accent2);text-align:right;
  outline:none;transition:border-color .2s;-moz-appearance:textfield}
.bill-input::-webkit-outer-spin-button,.bill-input::-webkit-inner-spin-button{-webkit-appearance:none}
.bill-input:focus{border-color:var(--accent)}

.meter-grid{display:flex;flex-direction:column;gap:10px}
.meter-row{display:grid;grid-template-columns:52px 1fr 80px 100px;align-items:center;gap:12px;
  background:var(--card2);border-radius:12px;padding:12px 16px;border:1px solid transparent;transition:all .2s}
.meter-row:hover{border-color:var(--border)}
.meter-label{width:48px;height:48px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-weight:700;font-size:.9rem;color:#fff;flex-shrink:0;line-height:1.1}
.meter-label small{font-size:.55rem;font-weight:500;opacity:.85}
.meter-label.a{background:var(--meter-a)}.meter-label.b{background:var(--meter-b)}.meter-label.c{background:var(--meter-c)}.meter-label.d{background:var(--meter-d)}.meter-label.e{background:var(--meter-e)}
.meter-input{width:100%;background:transparent;border:none;border-bottom:2px solid var(--border);padding:8px 4px;
  font-family:'JetBrains Mono',monospace;font-size:1.1rem;color:var(--text);outline:none;transition:border-color .2s;-moz-appearance:textfield}
.meter-input::-webkit-outer-spin-button,.meter-input::-webkit-inner-spin-button{-webkit-appearance:none}
.meter-input:focus{border-bottom-color:var(--accent)}
.meter-input::placeholder{color:var(--text3);font-size:.85rem}
.meter-usage{font-family:'JetBrains Mono',monospace;font-size:.9rem;color:var(--text2);text-align:right}
.meter-usage .val{color:var(--green);font-weight:600}
.meter-cost{font-family:'JetBrains Mono',monospace;font-size:1.1rem;font-weight:600;color:var(--red);text-align:right}
.meter-prev{font-size:.7rem;color:var(--text3);margin-top:2px}

.summary{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:4px}
.summary-item{text-align:center;padding:14px 8px;background:var(--card2);border-radius:12px}
.summary-item .label{font-size:.7rem;color:var(--text3);text-transform:uppercase;letter-spacing:.06em}
.summary-item .value{font-family:'JetBrains Mono',monospace;font-size:1.3rem;font-weight:600;margin-top:4px;color:var(--accent2)}

.actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.btn{padding:12px 20px;border-radius:10px;border:none;cursor:pointer;font-family:'Noto Sans TC',sans-serif;font-size:.85rem;font-weight:500;transition:all .2s;flex:1;min-width:120px}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:var(--accent2);transform:translateY(-1px)}
.btn-line{background:#06C755;color:#fff}.btn-line:hover{background:#05b04c;transform:translateY(-1px)}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text2)}.btn-outline:hover{border-color:var(--text2);color:var(--text)}
.btn-danger{background:transparent;border:1px solid rgba(255,107,107,.3);color:var(--red)}.btn-danger:hover{background:rgba(255,107,107,.1)}

.history-section{margin-top:8px}
.history-toggle{width:100%;background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:14px 20px;
  color:var(--text2);font-size:.85rem;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-family:'Noto Sans TC',sans-serif;transition:all .2s}
.history-toggle:hover{border-color:var(--accent);color:var(--text)}
.history-list{max-height:0;overflow:hidden;transition:max-height .4s ease}
.history-list.open{max-height:4000px}
.history-entry{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:16px;margin-top:8px;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.history-entry .h-date{font-size:.8rem;color:var(--accent2);font-weight:600;margin-bottom:8px}
.history-entry .h-row{display:flex;justify-content:space-between;padding:4px 0;font-size:.82rem;border-bottom:1px solid var(--border)}
.history-entry .h-row:last-child{border:none}
.history-entry .h-meter{font-weight:600}
.history-entry .h-cost{color:var(--red);font-family:'JetBrains Mono',monospace;font-weight:600}
.history-entry .h-total{margin-top:8px;padding-top:8px;border-top:1px solid var(--border);font-size:.8rem;color:var(--text2);display:flex;justify-content:space-between}

.col-headers{display:grid;grid-template-columns:52px 1fr 80px 100px;gap:12px;padding:0 16px;margin-bottom:6px}
.col-headers span{font-size:.7rem;color:var(--text3);text-transform:uppercase;letter-spacing:.06em}
.col-headers span:nth-child(3),.col-headers span:nth-child(4){text-align:right}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);
  background:var(--green);color:#000;padding:12px 24px;border-radius:10px;font-size:.85rem;font-weight:600;
  opacity:0;transition:all .4s ease;pointer-events:none;z-index:100}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}

.result-banner{background:linear-gradient(135deg,var(--accent-glow),rgba(81,207,102,.08));border:1px solid var(--accent);
  border-radius:14px;padding:20px;margin-bottom:16px;text-align:center}
.result-banner .rb-title{font-size:.95rem;color:var(--accent2);font-weight:700;margin-bottom:14px}
.result-table{width:100%;border-collapse:collapse}
.result-table th{font-size:.7rem;color:var(--text3);text-transform:uppercase;padding:6px 8px;text-align:center}
.result-table td{padding:8px;text-align:center;font-family:'JetBrains Mono',monospace;font-size:.9rem;border-top:1px solid var(--border)}
.result-table .r-meter{font-weight:700}
.result-table .r-cost{color:var(--red);font-weight:700;font-size:1.05rem}
.result-table .r-total{border-top:2px solid var(--accent);font-weight:700;color:var(--accent2)}

@media(max-width:480px){
  .meter-row{grid-template-columns:48px 1fr 60px 80px;gap:8px;padding:10px 12px}
  .bill-input{font-size:1.5rem}
  .summary{grid-template-columns:1fr}
  .col-headers{grid-template-columns:48px 1fr 60px 80px;gap:8px;padding:0 12px}
  .result-table{font-size:.8rem}
  .result-table td,.result-table th{padding:5px 4px}
}
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <h1>⚡ 每月電費分攤</h1>
    <p>輸入帳單金額與各電表度數，自動計算分攤費用</p>
  </div>

  <!-- 2026/4 Result Banner -->
  <div class="result-banner" id="resultBanner">
    <div class="rb-title">📋 2026/4 期電費分攤結果（總電費 1,979 元）</div>
    <table class="result-table">
      <thead><tr><th>電表</th><th>上期<br>(2026/2)</th><th>本期<br>(2026/4)</th><th>用量</th><th>分攤金額</th></tr></thead>
      <tbody>
        <tr><td class="r-meter" style="color:var(--meter-a)">A(上右)</td><td>826</td><td>893</td><td>67</td><td class="r-cost">226 元</td></tr>
        <tr><td class="r-meter" style="color:var(--meter-b)">B(下左)</td><td>841</td><td>915</td><td>74</td><td class="r-cost">250 元</td></tr>
        <tr><td class="r-meter" style="color:var(--meter-c)">C(下右)</td><td>1621</td><td>1791</td><td>170</td><td class="r-cost">574 元</td></tr>
        <tr><td class="r-meter" style="color:var(--meter-d)">D(上中)</td><td>1559</td><td>1727</td><td>168</td><td class="r-cost">567 元</td></tr>
        <tr><td class="r-meter" style="color:var(--meter-e)">E(上左)</td><td>1476</td><td>1583</td><td>107</td><td class="r-cost">361 元</td></tr>
        <tr class="r-total"><td colspan="3">總用量 586 度</td><td colspan="2">每度 3.38 元</td></tr>
      </tbody>
    </table>
  </div>

  <!-- Bill Amount -->
  <div class="card">
    <div class="card-title"><span>💰</span> 下一期帳單</div>
    <div class="bill-input-wrap">
      <input type="number" class="bill-input" id="totalBill" placeholder="輸入總金額" oninput="calc()">
    </div>
  </div>

  <!-- Meter Readings -->
  <div class="card">
    <div class="card-title"><span>📊</span> 各電表抄表度數</div>
    <div class="col-headers">
      <span>電表</span><span>本期度數</span><span>用量</span><span>分攤</span>
    </div>
    <div class="meter-grid" id="meterGrid"></div>
  </div>

  <!-- Summary -->
  <div class="summary">
    <div class="summary-item"><div class="label">總用量</div><div class="value" id="sumUsage">0 度</div></div>
    <div class="summary-item"><div class="label">每度單價</div><div class="value" id="unitPrice">0 元</div></div>
    <div class="summary-item"><div class="label">分攤合計</div><div class="value" id="sumCost">0 元</div></div>
  </div>

  <!-- Actions -->
  <div class="actions">
    <button class="btn btn-primary" onclick="saveRecord()">✓ 確認存檔，結算本期</button>
    <button class="btn btn-line" onclick="copyForLine()">💬 複製 LINE 格式</button>
    <button class="btn btn-outline" onclick="exportJSON()">⬇ 匯出 JSON 備份</button>
    <button class="btn btn-outline" onclick="document.getElementById('importFile').click()">⬆ 匯入 JSON</button>
    <input type="file" id="importFile" accept=".json" style="display:none" onchange="importJSON(event)">
    <button class="btn btn-danger" onclick="clearAll()">清空全部紀錄</button>
  </div>

  <!-- History -->
  <div class="card history-section">
    <button class="history-toggle" onclick="toggleHistory()">
      <span>📋 歷史紀錄</span>
      <span id="histArrow">▼</span>
    </button>
    <div class="history-list" id="historyList"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const METERS = ['A','B','C','D','E'];
const COLORS = {A:'a',B:'b',C:'c',D:'d',E:'e'};
const POS = {A:'上右',B:'下左',C:'下右',D:'上中',E:'上左'};
const LABEL = (m) => m + '(' + POS[m] + ')';

// Seed: 2026/4 period results, base is 2026/2
const SEED_LAST = { A:893, B:915, C:1791, D:1727, E:1583 };
const SEED_HISTORY = [
  {
    date:'2026/04', bill:1979, total:586, unit:3.3771,
    details:{
      A:{reading:893,prev:826,usage:67,cost:226},
      B:{reading:915,prev:841,usage:74,cost:250},
      C:{reading:1791,prev:1621,usage:170,cost:574},
      D:{reading:1727,prev:1559,usage:168,cost:567},
      E:{reading:1583,prev:1476,usage:107,cost:361}
    }
  }
];

let cachedLast = null;
let cachedHistory = null;

async function loadData(){
  try {
    const r = await window.storage.get('elec_last');
    cachedLast = r ? JSON.parse(r.value) : null;
  } catch{ cachedLast = null; }
  try {
    const r = await window.storage.get('elec_history');
    cachedHistory = r ? JSON.parse(r.value) : null;
  } catch{ cachedHistory = null; }

  if(!cachedLast){
    cachedLast = SEED_LAST;
    try{ await window.storage.set('elec_last', JSON.stringify(SEED_LAST)); }catch{}
  }
  if(!cachedHistory){
    cachedHistory = SEED_HISTORY;
    try{ await window.storage.set('elec_history', JSON.stringify(SEED_HISTORY)); }catch{}
  }
}

function getLastReadings(){ return cachedLast || SEED_LAST; }
function getHistory(){ return cachedHistory || SEED_HISTORY; }
async function setLastReadings(o){ cachedLast=o; try{await window.storage.set('elec_last',JSON.stringify(o));}catch{} }
async function setHistory(a){ cachedHistory=a; try{await window.storage.set('elec_history',JSON.stringify(a));}catch{} }

function initUI(){
  const grid = document.getElementById('meterGrid');
  const last = getLastReadings();
  grid.innerHTML = '';
  METERS.forEach(m => {
    const prev = last[m] ?? '';
    const div = document.createElement('div');
    div.className = 'meter-row';
    div.innerHTML = `
      <div class="meter-label ${COLORS[m]}"><span>${m}</span><small>${POS[m]}</small></div>
      <div>
        <input type="number" class="meter-input" id="val_${m}" placeholder="輸入度數" oninput="calc()">
        <div class="meter-prev">上期：${prev !== '' ? prev : '—'}</div>
      </div>
      <div class="meter-usage" id="usage_${m}"><span class="val">0</span> 度</div>
      <div class="meter-cost" id="cost_${m}">0 元</div>
    `;
    grid.appendChild(div);
  });
  renderHistory();
}

function calc(){
  const bill = parseFloat(document.getElementById('totalBill').value) || 0;
  const last = getLastReadings();
  let total = 0;
  const usages = {};

  METERS.forEach(m => {
    const cur = parseFloat(document.getElementById('val_'+m).value);
    const prev = last[m] !== undefined ? parseFloat(last[m]) : NaN;
    let usage = 0;
    if(!isNaN(cur)){
      usage = !isNaN(prev) ? Math.max(cur - prev, 0) : cur;
    }
    usages[m] = usage;
    total += usage;
    document.getElementById('usage_'+m).innerHTML = `<span class="val">${usage}</span> 度`;
  });

  document.getElementById('sumUsage').textContent = total + ' 度';
  let costSum = 0;
  if(total > 0 && bill > 0){
    const unit = bill / total;
    document.getElementById('unitPrice').textContent = unit.toFixed(2) + ' 元';
    METERS.forEach(m => {
      const share = Math.round(usages[m] * unit);
      costSum += share;
      document.getElementById('cost_'+m).textContent = share + ' 元';
    });
  } else {
    document.getElementById('unitPrice').textContent = '0 元';
    METERS.forEach(m => document.getElementById('cost_'+m).textContent = '0 元');
  }
  document.getElementById('sumCost').textContent = costSum + ' 元';
}

async function saveRecord(){
  const bill = parseFloat(document.getElementById('totalBill').value) || 0;
  if(bill <= 0){ showToast('請先輸入帳單金額','var(--amber)'); return; }

  const last = getLastReadings();
  const newLast = {};
  const details = {};
  let total = 0;
  let allFilled = true;

  METERS.forEach(m => {
    const cur = parseFloat(document.getElementById('val_'+m).value);
    if(isNaN(cur)){ allFilled = false; return; }
    const prev = last[m] !== undefined ? parseFloat(last[m]) : NaN;
    let usage = !isNaN(prev) ? Math.max(cur - prev, 0) : cur;
    total += usage;
    newLast[m] = cur;
    details[m] = { reading:cur, prev:!isNaN(prev)?prev:null, usage };
  });

  if(!allFilled){ showToast('請填寫所有電表度數','var(--amber)'); return; }
  if(total <= 0){ showToast('使用度數為零，請確認','var(--amber)'); return; }

  const unit = bill / total;
  METERS.forEach(m => { details[m].cost = Math.round(details[m].usage * unit); });

  const now = new Date();
  const record = {
    date: now.getFullYear()+'/'+String(now.getMonth()+1).padStart(2,'0'),
    bill, total, unit:+unit.toFixed(4), details
  };

  const hist = getHistory();
  hist.unshift(record);
  await setHistory(hist);
  await setLastReadings(newLast);

  showToast('✓ 已存檔！下次輸入新度數即可計算','var(--green)');

  METERS.forEach(m => document.getElementById('val_'+m).value = '');
  document.getElementById('totalBill').value = '';
  initUI();
}

let histOpen = false;
function toggleHistory(){
  histOpen = !histOpen;
  document.getElementById('historyList').classList.toggle('open', histOpen);
  document.getElementById('histArrow').textContent = histOpen ? '▲' : '▼';
}

function renderHistory(){
  const hist = getHistory();
  const el = document.getElementById('historyList');
  if(!hist.length){ el.innerHTML='<div style="padding:16px;text-align:center;color:var(--text3);font-size:.85rem">尚無歷史紀錄</div>'; return; }
  el.innerHTML = hist.map((r,i) => {
    const rows = METERS.map(m => {
      const d = r.details[m];
      return `<div class="h-row"><span class="h-meter">${LABEL(m)}</span><span>${d.prev!==null?d.prev+'→'+d.reading:d.reading} (${d.usage}度)</span><span class="h-cost">${d.cost} 元</span></div>`;
    }).join('');
    return `<div class="history-entry"><div class="h-date">${r.date}　帳單 ${r.bill} 元</div>${rows}<div class="h-total"><span>總用量 ${r.total} 度</span><span>每度 ${r.unit} 元</span></div><button class="btn btn-outline" style="margin-top:8px;flex:none;min-width:auto;padding:6px 12px;font-size:.75rem" onclick="deleteRecord(${i})">刪除此筆</button></div>`;
  }).join('');
}

async function deleteRecord(idx){
  if(!confirm('確定刪除此筆紀錄？')) return;
  const hist = getHistory();
  hist.splice(idx,1);
  await setHistory(hist);
  renderHistory();
  showToast('已刪除','var(--text2)');
}

async function clearAll(){
  if(!confirm('確定清空所有紀錄與上期度數？此操作無法復原。')) return;
  try{ await window.storage.delete('elec_last'); await window.storage.delete('elec_history'); }catch{}
  cachedLast = null; cachedHistory = null;
  document.getElementById('totalBill').value = '';
  const b = document.getElementById('resultBanner'); if(b) b.style.display='none';
  initUI();
  showToast('已清空所有資料','var(--text2)');
}

function showToast(msg, bg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.background = bg||'var(--green)';
  t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2400);
}

// --- 複製 LINE 格式 ---
function copyForLine(){
  // 優先用目前畫面上正在計算的資料，若沒有則取最近一筆歷史
  const bill = parseFloat(document.getElementById('totalBill').value) || 0;
  const last = getLastReadings();
  let hasInput = bill > 0;
  let lines = [];

  if(hasInput){
    // 從目前輸入產生
    let total = 0;
    const rows = [];
    METERS.forEach(m => {
      const cur = parseFloat(document.getElementById('val_'+m).value);
      const prev = last[m] !== undefined ? parseFloat(last[m]) : NaN;
      let usage = 0;
      if(!isNaN(cur)) usage = !isNaN(prev) ? Math.max(cur - prev, 0) : cur;
      total += usage;
      rows.push({m, prev:!isNaN(prev)?prev:'-', cur:isNaN(cur)?'-':cur, usage});
    });
    const unit = total > 0 ? bill / total : 0;
    const now = new Date();
    const period = now.getFullYear()+'/'+String(now.getMonth()+1).padStart(2,'0');
    lines.push('⚡ '+period+' 電費分攤（總額 '+bill.toLocaleString()+' 元）');
    lines.push('━━━━━━━━━━━━━━━━━');
    rows.forEach(r => {
      const cost = total > 0 ? Math.round(r.usage * unit) : 0;
      lines.push(r.m+'('+POS[r.m]+') '+r.prev+'→'+r.cur+' '+r.usage+'度 '+cost+'元');
    });
    lines.push('━━━━━━━━━━━━━━━━━');
    lines.push('合計 '+total+'度 ｜ 每度 '+unit.toFixed(2)+'元');
  } else {
    // 取最近一筆歷史
    const hist = getHistory();
    if(!hist.length){ showToast('尚無資料可複製','var(--amber)'); return; }
    const r = hist[0];
    lines.push('⚡ '+r.date+' 電費分攤（總額 '+r.bill.toLocaleString()+' 元）');
    lines.push('━━━━━━━━━━━━━━━━━');
    METERS.forEach(m => {
      const d = r.details[m];
      lines.push(m+'('+POS[m]+') '+(d.prev!==null?d.prev:'-')+'→'+d.reading+' '+d.usage+'度 '+d.cost+'元');
    });
    lines.push('━━━━━━━━━━━━━━━━━');
    lines.push('合計 '+r.total+'度 ｜ 每度 '+r.unit.toFixed(2)+'元');
  }

  const text = lines.join('\n');
  navigator.clipboard.writeText(text).then(()=>{
    showToast('✓ 已複製！直接貼到 LINE 即可','#06C755');
  }).catch(()=>{
    // fallback
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select(); document.execCommand('copy');
    document.body.removeChild(ta);
    showToast('✓ 已複製！直接貼到 LINE 即可','#06C755');
  });
}

// --- 匯出 JSON ---
function exportJSON(){
  const data = {
    exportDate: new Date().toISOString(),
    lastReadings: getLastReadings(),
    history: getHistory()
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = '電費分攤備份_' + new Date().toISOString().slice(0,10) + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('✓ JSON 備份已下載','var(--green)');
}

// --- 匯入 JSON ---
async function importJSON(e){
  const file = e.target.files[0];
  if(!file) return;
  try {
    const text = await file.text();
    const data = JSON.parse(text);
    if(!data.lastReadings || !data.history){
      showToast('檔案格式不正確，缺少必要欄位','var(--red)');
      return;
    }
    if(!confirm('匯入將覆蓋目前所有資料，確定要繼續嗎？')) return;
    await setLastReadings(data.lastReadings);
    await setHistory(data.history);
    showToast('✓ 匯入成功！','var(--green)');
    initUI();
  } catch(err){
    showToast('匯入失敗：' + err.message,'var(--red)');
  }
  e.target.value = '';
}

(async function(){ await loadData(); initUI(); })();
</script>
